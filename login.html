<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grocer Login Page</title>
   <link rel="stylesheet" href="login.css">
</head>
<body>
    <header class="header1">
        <a href="#" class="logo">Smart Grocer</a>
    </header>    

    <section class="login-section">
        <div class="login-container">
            
            <!-- Left Side (Brand / Image) -->
            <div class="login-left">
                <h1>Welcome to<br><span>Smart Grocer</span></h1>
                <p>Fresh Groceries, Easy Shopping, Better Living!</p>
            </div>

            <!-- Right Side (Form) -->
            <div class="login-right">
                <div class="login-box">
                    <h2>Login</h2>
                    <form action="login.php" method="post">

                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter Username" required>
                   

                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" minlength="8" maxlength="20" placeholder="Enter Password" required>

                        <button type="submit" class="btn">Login</button>

                        <p>Don’t have an account? <a href="Signup.html">Sign Up</a></p>
                    </form>
                </div>
            </div>

        </div>
    </section>   
</body>
</html>
