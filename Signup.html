<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Grocer - Sign Up</title>
  <link rel="stylesheet" href="Signup.css">
</head>
<body>

  <section class="signup-section">
    <div class="signup-container">

      <!-- Left Side Info -->
      <div class="signup-left">
        <img src="Images/logo.png" alt="Smart Grocer Logo" class="site-logo">
        <h1>Join <br><span>Smart Grocer</span></h1>
        <p>Create your account and start shopping smarter today!</p>
      </div>

      <!-- Right Side Form -->
      <div class="signup-right">
        <div class="signup-box">
          <h2>Create Account</h2>
          <form action="signup.php" method="POST">

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter Full Name &nbsp; ex: Mohomed Umar " required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter Email &nbsp; ex: 123@example.com" required>

            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Create Username &nbsp; ex: JohnDoe" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" maxlength="20" placeholder="Create Password &nbsp; ex: A@126789" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="8" maxlength="20" placeholder="Confirm Password &nbsp; ex: A@126789" required>

            <button type="submit" name="signup" class="btn">Sign Up</button>

            <p>Already have an account? <a href="login.html">Login</a></p><br>
            
          </form>
        </div>
      </div>

    </div>
  </section>
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

</body>
</html>
